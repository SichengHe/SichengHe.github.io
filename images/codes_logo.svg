<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
  <defs>
    <linearGradient id="grad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8200"/>
      <stop offset="100%" style="stop-color:#e07000"/>
    </linearGradient>
  </defs>

  <!-- Concept 8: Code/Computational - Angle Brackets -->
  <g transform="translate(10, 20)">
    <!-- Left bracket < -->
    <path d="M 35 10 L 10 40 L 35 70"
          fill="none" stroke="url(#grad8)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right bracket > -->
    <path d="M 55 10 L 80 40 L 55 70"
          fill="none" stroke="url(#grad8)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slash / in middle -->
    <line x1="52" y1="15" x2="38" y2="65" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="105" y="72" font-family="Verdana, sans-serif" font-size="52" font-weight="700">
    <tspan fill="url(#grad8)">C</tspan><tspan fill="#333">ODES</tspan>
  </text>
  <text x="106" y="95" font-family="Verdana, sans-serif" font-size="11" fill="#666" letter-spacing="0.5">
    Computational Optimization for Dynamics &amp; Engineering Systems
  </text>
</svg>

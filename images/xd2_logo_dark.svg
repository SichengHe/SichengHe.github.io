<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
  <!-- Buffeting airfoil icon -->
  <g transform="translate(48, 56)">
    <!-- Airfoil silhouette -->
    <path d="M -34 2
             C -32 -6, -18 -11, -6 -10
             C 8 -9, 22 -6, 34 -1
             C 28 2, 10 4, -8 4
             C -22 4, -32 4, -34 2 Z"
          fill="#fff"/>

    <!-- Wavy shock wave -->
    <path d="M 8 -9 Q 11 -15, 7 -21 Q 3 -27, 9 -33 Q 13 -37, 10 -42"
          fill="none" stroke="#fff" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pressure wave fronts -->
    <path d="M -4 -22 Q 8 -28, 22 -20"
          fill="none" stroke="#fff" stroke-width="1.4"
          stroke-linecap="round" opacity="0.5"/>
    <path d="M -8 -30 Q 8 -38, 26 -28"
          fill="none" stroke="#fff" stroke-width="1.4"
          stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- XD wordmark -->
  <text x="100" y="58" font-family="Verdana, sans-serif" font-size="48" font-weight="700">
    <tspan fill="#fff">X</tspan><tspan fill="#ccc">D</tspan>
  </text>

  <!-- Superscript 2 -->
  <text x="188" y="36" font-family="Verdana, sans-serif" font-size="28" font-weight="700" fill="#ccc">2</text>

  <!-- Lab text -->
  <text x="222" y="58" font-family="Verdana, sans-serif" font-size="48" font-weight="400" fill="#aaa">Lab</text>

  <!-- Subtitle -->
  <text x="101" y="82" font-family="Verdana, sans-serif" font-size="10" fill="#bbb" letter-spacing="0.3">
    Extreme-Condition Dynamics &amp; Design Lab
  </text>

  <!-- Decorative line -->
  <line x1="100" y1="90" x2="450" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>

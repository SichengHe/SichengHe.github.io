<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
  <!-- Code brackets icon -->
  <g transform="translate(10, 20)">
    <!-- Left bracket < - white -->
    <path d="M 35 10 L 10 40 L 35 70"
          fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right bracket > - white -->
    <path d="M 55 10 L 80 40 L 55 70"
          fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slash / in middle - gray -->
    <line x1="52" y1="15" x2="38" y2="65" stroke="#999" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- CODES text -->
  <text x="100" y="58" font-family="Verdana, sans-serif" font-size="48" font-weight="700">
    <tspan fill="#fff">C</tspan><tspan fill="#ccc">ODES</tspan>
  </text>

  <!-- Group text -->
  <text x="310" y="58" font-family="Verdana, sans-serif" font-size="48" font-weight="400" fill="#aaa">
    Group
  </text>

  <!-- Subtitle -->
  <text x="101" y="82" font-family="Verdana, sans-serif" font-size="10" fill="#bbb" letter-spacing="0.3">
    Computational Optimization for Dynamics &amp; Engineering Systems
  </text>

  <!-- Decorative line -->
  <line x1="100" y1="90" x2="450" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>
